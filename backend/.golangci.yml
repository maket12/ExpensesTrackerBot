run:
  tests: true
  timeout: 5m

linters:
  enable:
    - bodyclose
    - noctx
    - revive
    - sqlclosecheck
    - gofmt
    - goimports

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: '(.+)_test\.go'
      linters:
        - noctx
        - bodyclose
    - path: 'docs/'
      linters:
        - typecheck
        - revive
  exclude-dirs:
    - docs
    - internal/domain/port/mocks
