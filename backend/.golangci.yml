version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - noctx
    - revive
    - sqlclosecheck
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: '(.+)_test\.go'
        linters:
          - noctx
          - bodyclose
      - path: 'docs/'
        linters:
          - typecheck
          - revive
    paths:
      - ^docs/
      - internal/domain/port/mocks
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^docs/
      - internal/domain/port/mocks
      - third_party$
      - builtin$
      - examples$
