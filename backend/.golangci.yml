version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - sqlclosecheck
    - unused
    - revive
    - misspell
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -QF1003
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true